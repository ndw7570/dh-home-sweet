services:
  db:
    # TimescaleDB 는 PostgreSQL 확장자. 이미지는 PostgreSQL 이 이미 들어 있는 형태.
    # docs/kis-stack-plan.md 참조: 봉 데이터가 커지기 전에 hypertable 로 관리하기 위해 처음부터 채택.
    image: timescale/timescaledb:2.16.1-pg16
    environment:
      POSTGRES_DB: trading_discipline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 최초 컨테이너 생성 시 1회만 실행됨. 재실행하려면 볼륨을 지워야 한다.
      # TimescaleDB 확장은 hypertable 마이그레이션(phase 2)에서 CREATE EXTENSION 을 넣는다.
      - ./investments-nam.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading_discipline"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    # Celery broker + Channels layer + Streams(향후 phase). 셋 다 한 인스턴스로 시작.
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    # ASGI 로 승격 — Channels(웹소켓) 를 함께 서비스하기 위해서. HTTP 도 daphne 가 처리.
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "core.asgi:application"]
    environment: &django-env
      DJANGO_SECRET_KEY: dev-only-insecure-key-change-me
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,backend
      DB_ENGINE: postgres
      DB_SCHEMA: trading_discipline_management
      DB_NAME: trading_discipline
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: "5432"
      STRICT_QUERY_PARAMS: "1"
      CORS_ALLOWED_ORIGINS: http://localhost:9070,http://127.0.0.1:9070
      TIME_ZONE: Asia/Seoul
      LOG_LEVEL: INFO
      REDIS_URL: redis://redis:6379/0
      # KIS 연동은 mock 으로 시작 (phase 3~6 에서 실제 연동)
      KIS_ENV: paper
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    # Celery 워커 — 배치 태스크, 봉 집계, 리페어 (phase 4~)
    command: ["celery", "-A", "core", "worker", "--loglevel=info"]
    environment: *django-env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    # Celery Beat — 스케줄. 장 시작/종료 훅, 분봉 집계 등 (phase 4~)
    command: ["celery", "-A", "core", "beat", "--loglevel=info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    environment: *django-env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  collector:
    build: ./backend
    # KIS WebSocket collector. 반드시 별도 프로세스 — web 이나 worker 안에서 돌리면 재시작·오토스케일 시 중복 구독.
    # phase 3 에서 실제 로직 채움. 지금은 자리만 잡아 둔다.
    command: ["python", "manage.py", "run_kis_collector"]
    environment: *django-env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # phase 3 전까지 커맨드가 없으니 컨테이너가 죽는다. 자동 재시작으로 뜨는 상태만 유지하려면
    # 아래 restart 정책을 활성화한다. 개발 편의를 위해 기본은 꺼 둔다.
    # restart: unless-stopped
    profiles: ["collector"]  # 명시적으로 `docker compose --profile collector up` 해야 뜬다

  frontend:
    build: ./frontend
    environment:
      # 컨테이너 내부에서 백엔드를 부를 때는 서비스명(backend)으로.
      VITE_API_TARGET: http://backend:8000
      VITE_API_BASE: /api/trading
      VITE_USE_MOCK: "0"
    ports:
      - "9070:9070"
    volumes:
      - ./frontend:/app
      # 호스트 node_modules 로 컨테이너 것을 덮지 않도록 익명 볼륨으로 가린다.
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
